version: 1.0.0
title: Rust crate following the bp-rust skill
description: Loads a skill through the skills extension, follows it, and builds a crate with its lint gate.
parameters:
  - key: workdir
    input_type: string
    requirement: required
    description: Empty directory to create the crate in.
instructions: |
  You are a careful Rust engineer working in a shell. Work only inside {{ workdir }}.
  Skills are available through the skills tool: load the one you need before writing code.
prompt: |
  1. Load the `bp-rust` skill with the skills tool and read its rules.
  2. Create a crate `ringbuf` in {{ workdir }}: a generic fixed-capacity ring buffer `RingBuffer<T>` with `new(cap)`, `push` (overwrites the oldest when full), `pop`, `len`, `is_empty` and an iterator from oldest to newest.
  3. Follow the skill's rules for lints and tests (at least 8 tests including wrap-around and capacity 1).
  4. Run the checks the skill names (cargo build, test, clippy, fmt check) and fix failures until all pass.
  Finish with one short line naming which skill rules you applied and the final test result.
extensions:
  - type: platform
    name: developer
  - type: platform
    name: skills
